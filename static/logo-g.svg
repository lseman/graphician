<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="gGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="gGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="36" fill="url(#bgGrad)"/>

  <!-- Abstract G monogram made from a thick path with a node at the end -->
  <g filter="url(#glow)">
    <!-- Main G stroke -->
    <path d="M 130 52
             L 70 52
             A 55 55 0 1 0 130 108
             L 130 130
             L 90 130
             L 90 108
             L 108 108
             L 108 70
             L 70 70
             A 37 37 0 0 0 70 144
             L 120 144
             A 55 55 0 0 0 120 52
             Z"
          fill="url(#gGrad)" opacity="0.95"/>

    <!-- Graph node at the G's inner tail -->
    <circle cx="120" cy="130" r="7" fill="#0f172a" stroke="url(#gGrad2)" stroke-width="3"/>
    <circle cx="120" cy="130" r="3" fill="#10b981"/>
  </g>

  <!-- Subtle secondary node on the outer edge -->
  <circle cx="68" cy="108" r="4" fill="#0ea5e9" opacity="0.7"/>
</svg>
