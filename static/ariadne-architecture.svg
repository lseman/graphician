<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect x="10" y="10" width="180" height="60" rx="5" fill="#4a90d9" stroke="#2c5f8a" stroke-width="2"/>
  <text x="100" y="35" text-anchor="middle" fill="white" font-size="14" font-weight="bold">Graph Core</text>
  <text x="100" y="55" text-anchor="middle" fill="white" font-size="11">nodes, edges, persistence</text>

  <rect x="210" y="10" width="180" height="60" rx="5" fill="#5cb85c" stroke="#3d8b3d" stroke-width="2"/>
  <text x="300" y="35" text-anchor="middle" fill="white" font-size="14" font-weight="bold">Extraction</text>
  <text x="300" y="55" text-anchor="middle" fill="white" font-size="11">tree-sitter, parsers</text>

  <rect x="10" y="170" width="180" height="60" rx="5" fill="#f0ad4e" stroke="#c68632" stroke-width="2"/>
  <text x="100" y="195" text-anchor="middle" fill="white" font-size="14" font-weight="bold">Analysis</text>
  <text x="100" y="215" text-anchor="middle" fill="white" font-size="11">communities, impact, search</text>

  <rect x="210" y="170" width="180" height="60" rx="5" fill="#d9534f" stroke="#b52b27" stroke-width="2"/>
  <text x="300" y="195" text-anchor="middle" fill="white" font-size="14" font-weight="bold">Interfaces</text>
  <text x="300" y="215" text-anchor="middle" fill="white" font-size="11">CLI, MCP, tool API</text>

  <line x1="100" y1="70" x2="100" y2="170" stroke="#666" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="200" y1="40" x2="200" y2="200" stroke="#666" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="190" y1="40" x2="210" y2="40" stroke="#666" stroke-width="2"/>
  <line x1="100" y1="230" x2="300" y2="230" stroke="#666" stroke-width="2" stroke-dasharray="5,5"/>

  <text x="200" y="280" text-anchor="middle" fill="#333" font-size="12">Ariadne Code Graph Architecture</text>
</svg>
