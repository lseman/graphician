<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="srcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="graphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="anaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="cliGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Arrow marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>

    <!-- Shadow filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>

    <!-- Node gradient for graph -->
    <radialGradient id="nodeBlue" cx="40%" cy="40%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </radialGradient>
    <radialGradient id="nodeGreen" cx="40%" cy="40%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </radialGradient>
    <radialGradient id="nodeAmber" cx="40%" cy="40%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="420" rx="16" fill="url(#bg)"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">Graphician — Codebase Intelligence Pipeline</text>

  <!-- ════════════ LAYER 1: Source Code ════════════ -->
  <rect x="30" y="60" width="190" height="310" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="125" y="90" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="1">SOURCE CODE</text>

  <!-- Language boxes -->
  <rect x="50" y="105" width="150" height="32" rx="6" fill="url(#srcGrad)" opacity="0.85"/>
  <text x="125" y="125" text-anchor="middle" fill="#fff" font-size="12" font-weight="500">Rust / C++ / Java</text>

  <rect x="50" y="150" width="150" height="32" rx="6" fill="url(#srcGrad)" opacity="0.85"/>
  <text x="125" y="170" text-anchor="middle" fill="#fff" font-size="12" font-weight="500">TypeScript / JS</text>

  <rect x="50" y="195" width="150" height="32" rx="6" fill="url(#srcGrad)" opacity="0.85"/>
  <text x="125" y="215" text-anchor="middle" fill="#fff" font-size="12" font-weight="500">Python</text>

  <!-- tree-sitter -->
  <rect x="50" y="255" width="150" height="32" rx="6" fill="#334155" stroke="#475569" stroke-width="1"/>
  <text x="125" y="275" text-anchor="middle" fill="#cbd5e1" font-size="12">tree-sitter</text>

  <text x="125" y="310" text-anchor="middle" fill="#64748b" font-size="10">AST → AST → AST</text>
  <text x="125" y="330" text-anchor="middle" fill="#64748b" font-size="10">calls, imports, defs</text>

  <!-- Arrow to graph -->
  <line x1="220" y1="215" x2="290" y2="215" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="255" y="208" text-anchor="middle" fill="#64748b" font-size="9">parse</text>

  <!-- ════════════ LAYER 2: Code Graph ════════════ -->
  <rect x="290" y="60" width="320" height="310" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="450" y="90" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="1">CODE GRAPH</text>
  <text x="450" y="108" text-anchor="middle" fill="#475569" font-size="9">property graph · SQLite</text>

  <!-- Draw graph nodes and edges -->
  <!-- Edges -->
  <line x1="370" y1="140" x2="520" y2="150" stroke="#10b981" stroke-width="1.5" opacity="0.4"/>
  <line x1="460" y1="180" x2="560" y2="210" stroke="#10b981" stroke-width="1.5" opacity="0.4"/>
  <line x1="520" y1="250" x2="400" y2="310" stroke="#06b6d4" stroke-width="1.5" opacity="0.4"/>
  <line x1="370" y1="140" x2="460" y2="180" stroke="#10b981" stroke-width="1.5" opacity="0.4"/>
  <line x1="460" y1="180" x2="520" y2="250" stroke="#10b981" stroke-width="1.5" opacity="0.4"/>
  <line x1="520" y1="150" x2="560" y2="210" stroke="#06b6d4" stroke-width="1.5" opacity="0.4"/>
  <line x1="370" y1="140" x2="320" y2="200" stroke="#06b6d4" stroke-width="1.5" opacity="0.4"/>
  <line x1="460" y1="310" x2="320" y2="200" stroke="#10b981" stroke-width="1.5" opacity="0.4"/>

  <!-- Nodes -->
  <circle cx="370" cy="140" r="18" fill="url(#nodeBlue)" stroke="#1e293b" stroke-width="2"/>
  <text x="370" y="144" text-anchor="middle" fill="#fff" font-size="8">fn</text>

  <circle cx="460" cy="180" r="20" fill="url(#nodeGreen)" stroke="#1e293b" stroke-width="2"/>
  <text x="460" y="184" text-anchor="middle" fill="#fff" font-size="8">class</text>

  <circle cx="520" cy="150" r="16" fill="url(#nodeAmber)" stroke="#1e293b" stroke-width="2"/>
  <text x="520" y="154" text-anchor="middle" fill="#fff" font-size="8">mod</text>

  <circle cx="320" cy="200" r="17" fill="url(#nodeBlue)" stroke="#1e293b" stroke-width="2"/>
  <text x="320" y="204" text-anchor="middle" fill="#fff" font-size="7">call</text>

  <circle cx="560" cy="210" r="16" fill="url(#nodeAmber)" stroke="#1e293b" stroke-width="2"/>
  <text x="560" y="214" text-anchor="middle" fill="#fff" font-size="7">data</text>

  <circle cx="520" cy="250" r="19" fill="url(#nodeGreen)" stroke="#1e293b" stroke-width="2"/>
  <text x="520" y="254" text-anchor="middle" fill="#fff" font-size="8">import</text>

  <circle cx="370" cy="310" r="17" fill="url(#nodeBlue)" stroke="#1e293b" stroke-width="2"/>
  <text x="370" y="314" text-anchor="middle" fill="#fff" font-size="7">flow</text>

  <circle cx="460" cy="310" r="18" fill="url(#nodeGreen)" stroke="#1e293b" stroke-width="2"/>
  <text x="460" y="314" text-anchor="middle" fill="#fff" font-size="7">def</text>

  <text x="450" y="350" text-anchor="middle" fill="#475569" font-size="9">~10K nodes · ~25K edges</text>

  <!-- Arrow to analysis -->
  <line x1="610" y1="215" x2="660" y2="215" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="635" y="208" text-anchor="middle" fill="#64748b" font-size="9">query</text>

  <!-- ════════════ LAYER 3: Analysis ════════════ -->
  <rect x="660" y="60" width="210" height="310" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="765" y="90" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="1">ANALYSIS</text>

  <!-- Analysis chips -->
  <rect x="680" y="108" width="170" height="28" rx="14" fill="url(#anaGrad)" opacity="0.7"/>
  <text x="765" y="126" text-anchor="middle" fill="#fff" font-size="11">Impact · Paths</text>

  <rect x="680" y="144" width="170" height="28" rx="14" fill="url(#anaGrad)" opacity="0.7"/>
  <text x="765" y="162" text-anchor="middle" fill="#fff" font-size="11">Callers · Callees</text>

  <rect x="680" y="180" width="170" height="28" rx="14" fill="url(#anaGrad)" opacity="0.7"/>
  <text x="765" y="198" text-anchor="middle" fill="#fff" font-size="11">Flows · Architecture</text>

  <rect x="680" y="216" width="170" height="28" rx="14" fill="url(#anaGrad)" opacity="0.7"/>
  <text x="765" y="234" text-anchor="middle" fill="#fff" font-size="11">Communities · Bridges</text>

  <rect x="680" y="252" width="170" height="28" rx="14" fill="url(#anaGrad)" opacity="0.7"/>
  <text x="765" y="270" text-anchor="middle" fill="#fff" font-size="11">Cycles · Dead Code</text>

  <rect x="680" y="288" width="170" height="28" rx="14" fill="url(#anaGrad)" opacity="0.7"/>
  <text x="765" y="306" text-anchor="middle" fill="#fff" font-size="11">Risk · Diff Analysis</text>

  <rect x="680" y="324" width="170" height="28" rx="14" fill="url(#anaGrad)" opacity="0.7"/>
  <text x="765" y="342" text-anchor="middle" fill="#fff" font-size="11">Semantic Search</text>

  <!-- ════════════ Layer 4: CLI/Tool ════════════ -->
  <rect x="340" y="385" width="220" height="26" rx="6" fill="url(#cliGrad)" opacity="0.5" stroke="#8b5cf6" stroke-width="1"/>
  <text x="450" y="402" text-anchor="middle" fill="#e9d5ff" font-size="10" font-weight="500">CLI · JSON Tool API · MCP</text>

  <!-- Arrows from analysis down to CLI -->
  <line x1="450" y1="370" x2="450" y2="385" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Small decorative: language icons at top -->
  <text x="30" y="55" fill="#475569" font-size="8">📂</text>
  <text x="290" y="55" fill="#475569" font-size="8">🗃️</text>
  <text x="660" y="55" fill="#475569" font-size="8">📊</text>
</svg>
