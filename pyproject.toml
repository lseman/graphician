[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "graphician"
version = "0.1.1"
description = "A local-first code graph for navigating, reviewing, and reasoning about a codebase."
requires-python = ">=3.12"
dependencies = [
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-python>=0.25",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-rust>=0.24",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-go>=0.23",
    "networkx>=3.3",
    "numpy>=1.26",
]

[project.scripts]
graphician = "graphician.interfaces.cli:main"

[project.optional-dependencies]
# The abi3 extension is bundled in platform wheels. Keep the extra as a
# compatibility marker for existing ``graphician[native]`` install commands.
native = []
embeddings = [
    "httpx>=0.27",
    "sentence-transformers>=3.0",
]
jedi = [
    "jedi>=0.19",
]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "BLE", "RUF"]
# E501: enforced by the formatter, not the linter.
# F601: pre-existing duplicate keys in hand-curated library-stub data
# (src/graphician/extraction/library_stubs/) — fixing requires domain
# review of which entry is authoritative, tracked separately.
ignore = ["E501", "F601"]

[tool.mypy]
python_version = "3.12"
# Non-strict: the 251 errors surfaced when this repo's mypy config first
# ran to completion (see git history) are now all fixed and this file's
# checks are clean. `strict = true` still finds ~260 further errors,
# almost entirely missing annotations (no-untyped-def, no-untyped-call,
# untyped-decorator) plus some real gaps (type-arg, no-any-return) --
# a separate, larger annotation-completeness effort, tracked as follow-up.
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src", "tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=graphician --cov-report=term-missing --cov-report=xml --cov-fail-under=60"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
branch = true
source = ["graphician"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.maturin]
manifest-path = "graphician-native/Cargo.toml"
python-source = "src"
module-name = "graphician._extract.graphician_native"
bindings = "pyo3"
