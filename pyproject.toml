[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graphician"
version = "0.1.0"
description = "A local-first code graph for navigating, reviewing, and reasoning about a codebase."
requires-python = ">=3.11"
dependencies = [
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-python>=0.25",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-rust>=0.24",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-java>=0.23",
    "networkx>=3.3",
    "numpy>=1.26",
]

[project.scripts]
graphician = "graphician.interfaces.cli:main"

[project.optional-dependencies]
rust-extract = ["graphician-extract"]
embeddings = [
    "httpx>=0.27",
    "sentence-transformers>=3.0",
]
jedi = [
    "jedi>=0.19",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src", "tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=graphician --cov-report=term-missing --cov-report=xml --cov-fail-under=60"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
branch = true
source = ["graphician"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.hatch.build.targets.wheel]
packages = ["src/graphician"]
